version: "3.8"

services:
  frame_extractor:
    build:
      context: .
      dockerfile: Dockerfile
    image: soul-ai/frame_extractor:latest
    container_name: frame_extractor
    ports:
      - "8020:8020"
    environment:
      # AWS credentials — set these in your shell or a .env file
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      # Pose-bin deduplication tuning (raise POSE_BIN_STEP_DEG to drop more
      # near-identical frames; lower it for finer angular coverage).
      - FRAME_DEDUP_ENABLED=${FRAME_DEDUP_ENABLED:-true}
      - POSE_BIN_STEP_DEG=${POSE_BIN_STEP_DEG:-6}
      - MIN_QUALITY_SCORE=${MIN_QUALITY_SCORE:-0.0}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - default
      - api_default

networks:
  default:
  api_default:
    external: true
